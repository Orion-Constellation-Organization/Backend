version: "3.7"

services:
  reforca-api:
    container_name: reforca-api
    image: reforca-api:dev
    build:
      context: .
      target: development
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - 4444:4444
    command: npm run start:dev
    environment:
      NODE_ENV: development
      SERVER_PORT: 4444
      DB_DATABASE: reforca
      DB_CONNECTION_STRING: mongodb://reforca_root:j5m966qp7jiypfda@reforca-mongo:27017/reforca?authSource=admin
      JWT_SECRET: mySuperSecretKey12345
    networks:
      - reforca-connect

  reforca-mongo:
    container_name: reforca-mongo
    image: mongo:4.4
    environment:
      MONGO_INITDB_ROOT_USERNAME: reforca_root
      MONGO_INITDB_ROOT_PASSWORD: j5m966qp7jiypfda
      MONGO_INITDB_DATABASE: reforca
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db
    networks:
      - reforca-connect

networks:
  reforca-connect:
    driver: bridge

volumes:
  mongo-data:
  
